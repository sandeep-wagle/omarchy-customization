# SOF DSP crackle fix (MSI laptop, skl_hda_dsp_generic).
# Symptom in `journalctl --user -u pipewire`:
#   spa.alsa: hw:sofhdadspp: follower avail:N delay:N target:280 thr:256, resync
#   spa.audioconvert: ...: out of buffers on port 0
# Cause: the SOF firmware batches interrupts while PipeWire schedules the
# follower on timers; the hw FIFO (target only ~280 frames) underruns and the
# graph's converter pool starves behind the jitter (~30 glitch lines / 10min).
# Fix at the DEVICE level (monitor.alsa.rules matches ALSA device objects,
# not nodes -- matching node.name here silently never fires):
#   disable-batch = IRQs drive timing instead of batch timers
#   headroom      = slack frames so one late wakeup is not an underrun
# Period-size is left at driver default (changing it trades latency for
# stability; revisit only if resyncs persist).
# Verify live with:
#   pw-cli info <speaker-node-id> | grep -E "disable-batch|headroom"
# and re-count: journalctl --user -u pipewire --since "10 min ago" |
#   grep -cE "out of buffers|resync"
monitor.alsa.rules = [
  {
    matches = [
      { device.name = "alsa_card.pci-0000_00_1f.3-platform-skl_hda_dsp_generic" }
    ]
    actions = {
      update-props = {
        api.alsa.disable-batch = true
        api.alsa.headroom = 1024
      }
    }
  }
]
