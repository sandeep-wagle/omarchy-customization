# Defaults. Copy to ~/.config/mogtab/config.toml to override.

[alt]
target = "windows"
scope = "current-monitor"
same_class = false
include_special_workspaces = false

[super]
target = "workspaces"
scope = "current-monitor"

# Common alternatives:
#
# Windows/Super-Tab cycles windows from the current workspace:
# [super]
# target = "windows"
# scope = "current-workspace"
#
# Super-Tab cycles windows from the current monitor:
# [super]
# target = "windows"
# scope = "current-monitor"
#
# Alt-Tab global across all monitors:
# [alt]
# target = "windows"
# scope = "all"
#
# Alt-Tab limited to the current workspace:
# [alt]
# target = "windows"
# scope = "current-workspace"
#
# Same-app switching, useful for terminals/editors:
# [alt]
# target = "windows"
# scope = "all"
# same_class = true
#
# Monitor switching:
# [super]
# target = "monitors"
# scope = "all"
